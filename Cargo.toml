[workspace]
resolver = "2"
members = ["crates/proto", "crates/perf", "crates/mbt", "crates/server", "crates/client", "crates/ctl", "vendor/fuser"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/zorba/jackalopefs"

[workspace.dependencies]
jackalopefs-proto = { path = "crates/proto" }
jackalopefs-perf = { path = "crates/perf" }
jackalopefs-mbt = { path = "crates/mbt" }
jackalopefs-server = { path = "crates/server" }
jackalopefs-client = { path = "crates/client" }

anyhow = "1"
bytes = "1"
capnp = { version = "0.27", features = ["unaligned"] }
capnpc = "0.27"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fuser = { path = "vendor/fuser" }
humantime = "2"
io-uring = "0.7"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "dir", "user", "process"] }
parking_lot = "0.12"
quinn = "0.11"
rand = "0.9"
rcgen = "0.14"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
subtle = "2"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
