[package]
name = "jackalopefs-server"
description = "jackalopefs server: exports a directory over QUIC"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Records what this end does in the session model's terms (`jackalopefs_perf::spec_trace`), for the trace-validation tests.
spec-trace = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
humantime = { workspace = true }
jackalopefs-perf = { workspace = true }
jackalopefs-proto = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["resource", "inotify", "event"] }
parking_lot = { workspace = true }
quinn = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
syn = { workspace = true }
tempfile = { workspace = true }
